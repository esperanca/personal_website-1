<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Design tokens da interface do CMS. Mesma paleta do site
         (src/scss/utilities/_variables.scss), com uma variante do azul de
         destaque escurecida (--admin-accent-text) só pra uso como texto:
         o #0979fa original do site dá ~4.1:1 de contraste em branco, abaixo
         do mínimo de 4.5:1 do WCAG AA para texto normal. */
      :root {
        --admin-ink: #000036;
        --admin-surface-muted: #e8e7e8;
        --admin-border: #7b7a7d;
        --admin-border-focus: #2e2e31;
        --admin-accent: #0979fa;
        --admin-accent-text: #0a63cc;
        --admin-radius: 20px;
        --admin-radius-sm: 8px;
        --admin-font: 'Inter Tight', sans-serif;
      }

      /* Tipografia: própria da interface do CMS (não é a fonte do site;
         o preview usa a mesma família pra manter a experiência coesa). */
      body,
      input,
      textarea,
      select,
      button,
      [class] {
        font-family: var(--admin-font) !important;
      }

      [class*='ListCardTitle'],
      [class*='SidebarHeading'] {
        font-weight: 500 !important;
      }

      /* Cor de destaque nos estados ativos/seleção */
      .header-link-active,
      .sidebar-active,
      [class*='ListCardLink']:hover [class*='ListCardTitle'] {
        color: var(--admin-accent-text) !important;
      }
      .sidebar-active {
        background: rgba(10, 99, 204, 0.08) !important;
      }

      /* Botões: todo botão de ação usa o esquema de botão do site (fundo
         preto, texto branco, cantos bem arredondados, hover com opacidade).
         "Excluir entrada" é o inverso, pra se diferenciar sem sair da paleta. */
      [class*='-gray-gray'],
      [class*='ToolbarButton'],
      [class*='publishedButton'],
      [class*='DeleteButton'] {
        border-radius: var(--admin-radius) !important;
        font-weight: 600 !important;
        transition: opacity 0.2s ease !important;
      }
      [class*='-gray-gray']:hover,
      [class*='ToolbarButton']:hover,
      [class*='publishedButton']:hover,
      [class*='DeleteButton']:hover {
        opacity: 0.8 !important;
      }
      [class*='-gray-gray'],
      [class*='ToolbarButton'],
      [class*='publishedButton'] {
        background-color: var(--admin-ink) !important;
        color: #fff !important;
      }
      [class*='DeleteButton'] {
        background-color: #fff !important;
        color: var(--admin-ink) !important;
        border: 1px solid var(--admin-ink) !important;
      }

      /* Campos de formulário: rótulo, borda e estado de foco */
      [class*='FieldLabel'] {
        background: var(--admin-surface-muted) !important;
        color: var(--admin-ink) !important;
        border-radius: var(--admin-radius-sm) var(--admin-radius-sm) 0 0 !important;
      }
      input[class^='css-'],
      textarea[class^='css-'] {
        border-radius: 0 var(--admin-radius-sm) var(--admin-radius-sm) var(--admin-radius-sm) !important;
        border-color: var(--admin-border) !important;
      }
      input[class^='css-']:focus,
      textarea[class^='css-']:focus {
        border-color: var(--admin-border-focus) !important;
        box-shadow: 0 0 0 2px var(--admin-border-focus) inset !important;
      }
    </style>
  </head>
  <body>
    <!-- A tradução pt-BR vem do "locale: pt" em config.yml, suportado
         nativamente pelo bundle decap-cms. O pacote decap-cms-locales (que
         usávamos antes via CDN para CMS.registerLocale) foi removido: seu
         dist/decap-cms-locales.js publicado no unpkg é um bundle UMD
         quebrado — retorna um objeto vazio em vez das traduções — o que
         fazia CMS.registerLocale('pt', DecapCmsLocales.pt) lançar
         "Cannot read properties of undefined (reading 'pt')" e interromper
         o resto do script, inclusive registerPreviewTemplate logo abaixo
         (por isso o preview caía no template padrão, sem a fonte/CSS
         customizados). -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script>
      // O preview usa o mesmo CSS do site (/css/style.css: Noto Sans no
      // corpo, Playfair Display nos títulos, cores reais). Ajustes:
      // - padding fixo (em vez de só margin: auto) pra sempre respirar das
      //   bordas do painel, mesmo quando ele fica estreito (ex: dividido a
      //   50% da tela) e o max-width deixa de ter efeito;
      // - títulos pela metade do tamanho real do site — no site ocupam a
      //   largura de uma página inteira, no preview (coluna estreita)
      //   ficavam desproporcionais.
      var PREVIEW_CSS =
        "body { max-width: 90ch; margin: 0 auto; padding: 1.5rem; box-sizing: border-box; } " +
        "img, picture { max-width: 100%; height: auto; } " +
        ".inner-wrapper header h2 { font-size: 0.9375rem !important; } " +
        ".page__content h1 { font-size: 1.125rem !important; } " +
        ".page__content h2 { font-size: 1.125rem !important; } " +
        ".page__content h3 { font-size: 0.75rem !important; } " +
        ".page__content h4 { font-size: 0.5625rem !important; }";

      var PostPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          return h(
            "div",
            null,
            h("link", {rel: "stylesheet", href: "/css/style.css"}),
            h("style", null, PREVIEW_CSS),
            h(
              "div",
              {className: "inner-wrapper"},
              h(
                "header",
                null,
                h("h2", null, entry.getIn(["data", "title"]))
              ),
              h(
                "article",
                null,
                h(
                  "div",
                  {className: "page__content"},
                  this.props.widgetFor("body")
                )
              )
            )
          );
        },
      });

      CMS.registerPreviewTemplate("blog", PostPreview);
    </script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
